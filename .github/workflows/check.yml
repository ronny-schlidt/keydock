name: Check and Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
            artifact: macos
          - os: windows-latest
            bundle: nsis
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Sign and Verify macOS Development Bundle
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - src-tauri/target/release/bundle/macos/PromptKey.app
          codesign --verify --deep --strict src-tauri/target/release/bundle/macos/PromptKey.app
      - name: Archive macOS App
        if: runner.os == 'macOS'
        run: tar -czf PromptKey-macos.tar.gz -C src-tauri/target/release/bundle/macos PromptKey.app
      - uses: actions/upload-artifact@v4
        with:
          name: PromptKey-${{ matrix.artifact }}
          path: |
            PromptKey-macos.tar.gz
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
